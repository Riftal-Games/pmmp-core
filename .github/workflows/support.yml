name: 'Manage support request issues'

on:
  issues:
    types: [labeled, unlabeled, reopened]

# dessant/support-requests calls only the issues endpoints: comment, close,
# reopen, lock, unlock, get and remove a label. There is no checkout step.
permissions:
  issues: write

jobs:
  support:
    runs-on: [self-hosted, linux, riftal]
    steps:
      - uses: dessant/support-requests@v5
        with:
          github-token: ${{ github.token }}
          support-label:  "Support request"
          issue-comment: >
            Hi, we only accept **bug reports** on this issue tracker, but this issue looks like a support request.


            Instead of creating an issue, try the following:

            - Check our [Documentation](https://doc.pmmp.io) to see if you can find answers there

            - Ask the community on our [Discord server](https://discord.gg/vrPugybpJF)

          close-issue: true
          lock-issue: false
