name: CI

# A branch push is covered by its pull_request run. Triggering on both would
# run every job twice on the two shared self-hosted runners.
on:
  push:
    branches: [riftal]
  pull_request:
  workflow_dispatch:

jobs:
  all-php-versions:
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    uses: ./.github/workflows/main-php-matrix.yml
    with:
      php: ${{ matrix.php }}
    secrets: inherit

  codestyle:
    name: Code Style checks
    runs-on: [self-hosted, linux, riftal]
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP and tools
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3
          tools: php-cs-fixer:3.75
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep temp files off the shared /tmp
        uses: ./.github/actions/runner-temp

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --ansi

  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted, linux, riftal]
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Keep temp files off the shared /tmp
        uses: ./.github/actions/runner-temp
        with:
          php: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          # build/php is a vendored git submodule (pmmp/php-build-scripts),
          # not ours to fix or annotate. tests/plugins/DevTools and
          # examples/plugins/ExamplePlugin are submodules too but carry no
          # shell scripts, so they never reach the scan either way.
          ignore_paths: build/php

  actionlint:
    name: actionlint
    runs-on: [self-hosted, linux, riftal]
    env:
      # The image bundles shellcheck. actionlint skips its run: block checks
      # without a word when shellcheck is missing, and the runners have none.
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

    steps:
      - uses: actions/checkout@v7

      # The unquoted command substitution the publish workflow shipped with
      # until #157. A pass here would mean shellcheck never ran.
      - name: Check shellcheck runs on run blocks
        run: |
          set -euo pipefail
          if out="$(docker run --rm -i -m 1g --cpus 1 "$ACTIONLINT_IMAGE" -oneline - <<'EOF'
          on: push
          jobs:
            j:
              runs-on: ubuntu-latest
              steps:
                - run: echo CHANNEL=$(jq -r '.channel' new_build_info.json) >> $GITHUB_OUTPUT
          EOF
          )"; then
            echo "actionlint passed a run block shellcheck rejects"
            exit 1
          fi
          echo "$out"
          grep -q 'SC2046' <<<"$out" && grep -q 'SC2086' <<<"$out"

      - name: Run actionlint
        run: docker run --rm -m 1g --cpus 1 -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -oneline

  translations:
    name: Translation checks
    runs-on: [self-hosted, linux, riftal]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3

      - name: Keep temp files off the shared /tmp
        uses: ./.github/actions/runner-temp

      - name: Verify translations
        run: php .github/workflows/verify-translations.php ${{ github.workspace }}/resources/translations
