name: CI

# A branch push is covered by its pull_request run. Triggering on both would
# run every job twice on the two shared self-hosted runners.
on:
  push:
    branches: [riftal]
  pull_request:
  workflow_dispatch:

# A newer commit on a PR cancels that PR's older run. Any other event groups
# by its own run id, so a riftal run is never cancelled or queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  all-php-versions:
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    uses: ./.github/workflows/main-php-matrix.yml
    with:
      php: ${{ matrix.php }}
    secrets: inherit

  codestyle:
    name: Code Style checks
    runs-on: [self-hosted, linux, riftal]
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP and tools
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3
          tools: php-cs-fixer:3.75
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep temp files off the shared /tmp
        uses: ./.github/actions/runner-temp

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --ansi

  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted, linux, riftal]
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Keep temp files off the shared /tmp
        uses: ./.github/actions/runner-temp
        with:
          php: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          # build/php is a vendored git submodule (pmmp/php-build-scripts),
          # not ours to fix or annotate. tests/plugins/DevTools and
          # examples/plugins/ExamplePlugin are submodules too but carry no
          # shell scripts, so they never reach the scan either way.
          ignore_paths: build/php

  actionlint:
    name: actionlint
    runs-on: [self-hosted, linux, riftal]
    env:
      # The image bundles shellcheck. actionlint skips its run: block checks
      # without a word when shellcheck is missing, and the runners have none.
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

    steps:
      - uses: actions/checkout@v7

      # An unquoted command substitution and an unquoted variable, which
      # shellcheck reports as SC2046 and SC2086. A pass here would mean
      # shellcheck never ran.
      - name: Check shellcheck runs on run blocks
        run: |
          set -euo pipefail
          if out="$(docker run --rm -i -m 1g --cpus 1 "$ACTIONLINT_IMAGE" -oneline - <<'EOF'
          on: push
          jobs:
            j:
              runs-on: ubuntu-latest
              steps:
                - run: echo CHANNEL=$(jq -r '.channel' new_build_info.json) >> $GITHUB_OUTPUT
          EOF
          )"; then
            echo "actionlint passed a run block shellcheck rejects"
            exit 1
          fi
          echo "$out"
          grep -q 'SC2046' <<<"$out" && grep -q 'SC2086' <<<"$out"

      - name: Run actionlint
        run: docker run --rm -m 1g --cpus 1 -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -oneline

  docs-links:
    name: Docs links
    runs-on: [self-hosted, linux, riftal]

    steps:
      - uses: actions/checkout@v7

      - name: Keep temp files off the shared /tmp
        uses: ./.github/actions/runner-temp
        with:
          php: false

      # The self-test runs first so a check that can no longer fail never
      # gets to pass the real documents.
      - name: Self-test the docs link check
        run: bash .github/workflows/check-docs-links.selftest.sh

      - name: Check links, anchors and citations in docs/
        run: python3 .github/workflows/check-docs-links.py

  translations:
    name: Translation checks
    runs-on: [self-hosted, linux, riftal]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3

      - name: Keep temp files off the shared /tmp
        uses: ./.github/actions/runner-temp

      # Each fetched copy is cached under its content hash once it has passed
      # verification. When the fetch fails, the newest cached copy stands in
      # with a warning, so an outage at raw.githubusercontent.com does not
      # fail the job. With nothing cached, the restore fails the job instead.
      # A pull request can restore only what riftal or its own ref saved, and
      # GitHub evicts an entry unused for 7 days.
      - name: Fetch Mojang en_US.lang
        id: mojang
        run: bash .github/workflows/fetch-mojang-lang.sh https://raw.githubusercontent.com/Mojang/bedrock-samples/refs/heads/main/resource_pack/texts/en_US.lang

      - name: Restore the newest cached en_US.lang
        if: steps.mojang.outputs.sha == ''
        uses: actions/cache/restore@v6
        with:
          path: mojang-lang/en_US.lang
          key: mojang-en-us-lang-
          restore-keys: mojang-en-us-lang-
          fail-on-cache-miss: true

      - name: Verify translations
        run: php .github/workflows/verify-translations.php resources/translations mojang-lang/en_US.lang

      - name: Look up the fetched en_US.lang in the cache
        id: mojang-cached
        if: steps.mojang.outputs.sha != ''
        uses: actions/cache/restore@v6
        with:
          path: mojang-lang/en_US.lang
          key: mojang-en-us-lang-${{ steps.mojang.outputs.sha }}
          lookup-only: true

      - name: Cache the fetched en_US.lang
        if: steps.mojang.outputs.sha != '' && steps.mojang-cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mojang-lang/en_US.lang
          key: mojang-en-us-lang-${{ steps.mojang.outputs.sha }}

      # The fallback runs on every pass, not only during an outage, so a
      # restore that stops matching fails here before an outage finds it.
      # Port 9 refuses the connection, which takes the fetch's failure branch.
      - name: "Self-test the fallback: fetch from a refused URL"
        id: mojang-selftest
        run: |
          bash .github/workflows/fetch-mojang-lang.sh http://127.0.0.1:9/en_US.lang
          if [ -e mojang-lang/en_US.lang ]; then
            echo "::error::the refused fetch left a file behind, so the fallback was not reached"
            exit 1
          fi

      - name: "Self-test the fallback: restore the newest cached en_US.lang"
        id: mojang-selftest-restore
        if: steps.mojang-selftest.outputs.sha == ''
        uses: actions/cache/restore@v6
        with:
          path: mojang-lang/en_US.lang
          key: mojang-en-us-lang-
          restore-keys: mojang-en-us-lang-
          fail-on-cache-miss: true

      - name: "Self-test the fallback: verify against the restored copy"
        env:
          SELFTEST_SHA: ${{ steps.mojang-selftest.outputs.sha }}
          MATCHED_KEY: ${{ steps.mojang-selftest-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ -n "$SELFTEST_SHA" ] || [ -z "$MATCHED_KEY" ] || [ ! -s mojang-lang/en_US.lang ]; then
            echo "::error::the fallback did not restore a cached en_US.lang (sha='$SELFTEST_SHA', matched key='$MATCHED_KEY')"
            exit 1
          fi
          echo "Restored $MATCHED_KEY"
          php .github/workflows/verify-translations.php resources/translations mojang-lang/en_US.lang
