name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Every job below resets its own workspace ownership before checkout. The
# self-hosted runner (#46) reuses one workspace across runs, so a file a
# previous job's Docker mount left owned by a different uid blocks
# actions/checkout's own cleanup on the next run (#49). The reset is a no-op
# on a fresh GitHub-hosted runner.
jobs:
  all-php-versions:
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    uses: ./.github/workflows/main-php-matrix.yml
    with:
      php: ${{ matrix.php }}
    secrets: inherit

  codestyle:
    name: Code Style checks
    runs-on: [self-hosted, linux, riftal]
    strategy:
      fail-fast: false

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7

      - name: Setup PHP and tools
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3
          tools: php-cs-fixer:3.75
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --ansi

  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted, linux, riftal]
    strategy:
      fail-fast: false

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0

  translations:
    name: Translation checks
    runs-on: [self-hosted, linux, riftal]

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3

      - name: Verify translations
        run: php .github/workflows/verify-translations.php ${{ github.workspace }}/resources/translations
