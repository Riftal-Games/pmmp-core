name: Docker image CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, linux, riftal]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true #needed for build/php submodule

    # Pure text logic, no image needed. Runs before the build so a broken
    # stage-walk check fails in seconds instead of after the 20-40 minute
    # build it would otherwise silently misjudge.
    - name: Self-test the base-image stage-walk check
      shell: bash
      run: docker/check-ubuntu-base.selftest.sh

    # Same reasoning: pure UDP loopback against a fake responder, no image
    # needed, so a broken REACHABLE assertion fails in seconds rather than
    # after the build, and rather than passing quietly because a real
    # container happened to answer with the right bytes anyway.
    - name: Self-test the RakNet REACHABLE check
      shell: bash
      run: python3 .github/workflows/raknet-ping.selftest.py

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Create data directories
      run: mkdir ./docker/test_data

    - name: Build image for tag
      uses: docker/build-push-action@v7.3.0
      with:
        context: ${{ github.workspace }}
        push: false
        load: true
        file: ${{ github.workspace }}/docker/Dockerfile
        tags: local-pocketmine-mp
        build-args: |
          GIT_HASH=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Hard rule 7 fixes the base image for everything we build. Every other step
    # here would pass unchanged on any base, so without this one a stage left on
    # an older release, or a revert of a single FROM, ships green and unnoticed.
    - name: Test if it is built on the expected Ubuntu release
      shell: bash
      env:
        EXPECTED_UBUNTU: "24.04"
      run: |
        set -euo pipefail

        ACTUAL="$(docker run --rm local-pocketmine-mp sh -c '. /etc/os-release && printf %s "$VERSION_ID"')"
        echo "runtime stage reports Ubuntu $ACTUAL"
        if [ "$ACTUAL" != "$EXPECTED_UBUNTU" ]; then
          echo "::error::runtime stage is Ubuntu $ACTUAL, expected $EXPECTED_UBUNTU"
          exit 1
        fi

        # The two build stages leave no trace in the shipped image, so the
        # Dockerfile is the only place their base can be read. A build stage on
        # a newer release than the runtime stage links the PHP binaries it
        # compiles against a glibc the runtime stage does not have.
        #
        # This has to walk every `FROM` line, not just the ones that already
        # say `ubuntu:`. A stage rebased onto a different distro, a digest
        # pin, or a build-arg image name stops matching a `FROM ubuntu:`
        # filter and disappears from the check entirely instead of failing
        # it. `EXPECTED_STAGES` is this Dockerfile's current stage count
        # (build-php, build-pocketmine, runtime): bump it in the same change
        # that adds or removes a stage.
        EXPECTED_STAGES=3
        TOTAL="$(grep -c '^FROM ' docker/Dockerfile)"
        if [ "$TOTAL" -ne "$EXPECTED_STAGES" ]; then
          echo "::error::docker/Dockerfile declares $TOTAL FROM line(s), expected $EXPECTED_STAGES; update EXPECTED_STAGES if a stage was added or removed"
          exit 1
        fi

        # A stage that chains off an earlier one (`FROM build-pocketmine AS
        # final`) names a stage declared earlier in this Dockerfile, not an
        # external image, so it carries no Ubuntu version of its own to
        # check: it inherits whatever its parent stage already had to pass.
        # `--platform=...` is a flag on the FROM instruction, not part of
        # the image name, and has to be stripped before comparing. Both
        # kinds of line are still walked here, so a stage added or removed
        # still moves TOTAL above.
        #
        # The walk itself lives in docker/check-ubuntu-base.sh, not inline,
        # so docker/check-ubuntu-base.selftest.sh can run it against fixtures
        # that exercise both branches: docker/Dockerfile alone never does.
        STRAGGLERS="$(docker/check-ubuntu-base.sh docker/Dockerfile "$EXPECTED_UBUNTU")"
        if [ -n "$STRAGGLERS" ]; then
          echo "::error::stage(s) not on Ubuntu $EXPECTED_UBUNTU:"
          echo "$STRAGGLERS"
          exit 1
        fi
        echo "all $TOTAL stages pinned to Ubuntu $EXPECTED_UBUNTU"

    - name: Test if it runs the normal server properly
      timeout-minutes: 10
      run: echo stop | docker run --rm -i -e POCKETMINE_ARGS="--settings.enable-dev-builds=1" local-pocketmine-mp

    - name: Test if it loads plugins
      timeout-minutes: 10
      run: |
        echo stop | docker run --rm -i --user "$(id -u):$(id -g)" -v ./docker/test_data:/data -v ./docker/testsuite/create-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1" local-pocketmine-mp
        test -f ./docker/test_data/plugin_data/data-test/create-data
        test "$(cat ./docker/test_data/plugin_data/data-test/create-data)" = "successful"

    # The plugin's own exit(1) only proves the check ran when the plugin loads
    # far enough to run it. If it never loads at all, the server still reaches
    # Done and docker run still exits 0, so the step needs its own positive
    # evidence that the check actually happened, not just that nothing failed.
    - name: Test if it persists plugin data
      timeout-minutes: 10
      run: |
        LOG="$(mktemp)"
        echo stop | docker run --rm -i --user "$(id -u):$(id -g)" -v ./docker/test_data:/data -v ./docker/testsuite/verify-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1" local-pocketmine-mp | tee "$LOG"

        if ! grep -qF "Enabling data-test" "$LOG"; then
          echo "::error::data-test never enabled, so the persisted data was never actually checked"
          exit 1
        fi
        if ! grep -qF "Test passed: create-data is successful" "$LOG"; then
          echo "::error::verify-data did not report its explicit success notice"
          exit 1
        fi

    # REACHABLE coverage. The four steps above prove the image builds on the
    # right base and that the server boots and loads plugins, but none of them
    # publishes a port, so none of them can tell a joinable container from an
    # unjoinable one.
    # Bedrock is RakNet over UDP: a TCP-only publish produces a container that
    # passes every check above and that no client can join. Only a real UDP
    # round trip catches that.
    - name: Test if it is reachable over UDP
      timeout-minutes: 10
      shell: bash
      env:
        # Advertised Bedrock protocol. Derived from ProtocolInfo::CURRENT_PROTOCOL
        # in axolotl-pm/bedrock-protocol 62.0.0+bedrock-1.26.50, which
        # composer.lock pins. A protocol bump has to move this number
        # deliberately, because that is the value that otherwise diverges from
        # the client and from the proxy in silence.
        EXPECTED_PROTOCOL: "2193"
        EXPECTED_MOTD: "riftal-reachable-probe"
      run: |
        set -euo pipefail

        # A fixed name and port are harmless on a GitHub-hosted runner, which
        # is single-job and thrown away after. They collide the moment this
        # step runs twice against the same daemon, which is the normal case
        # on a self-hosted runner and on a local `/dev-stack` run. Tie both to
        # the run identity instead.
        CONTAINER_NAME="pm-reachable-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        HOST_PORT=$(( 20000 + (GITHUB_RUN_ID % 40000) ))

        LOG="$(mktemp)"
        FIFO="$(mktemp -u)"
        mkfifo "$FIFO"
        # Unlike the smoke steps above, this one needs the server alive while we
        # ping it, so it cannot pipe `echo stop` in. Hold stdin open through a
        # FIFO instead, and write `stop` into it once the ping is done, so the
        # shutdown stays clean.
        exec 3<>"$FIFO"

        DOCKER_PID=""
        # Runs on every exit from this point, including the readiness-timeout
        # `exit 1` below, so a server that never comes up is not left running
        # under the runner instead of being torn down with the job.
        cleanup() {
          local status=$?
          exec 3>&- 2>/dev/null || true
          if [ -n "$DOCKER_PID" ]; then
            docker stop "$CONTAINER_NAME" > /dev/null 2>&1 || true
            wait "$DOCKER_PID" 2>/dev/null || true
          fi
          docker rm "$CONTAINER_NAME" > /dev/null 2>&1 || true
          rm -f "$LOG" "$LOG.clean" "$FIFO"
          exit "$status"
        }
        trap cleanup EXIT

        docker run --name "$CONTAINER_NAME" -i \
          -p "$HOST_PORT:19132/udp" \
          -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --motd=$EXPECTED_MOTD" \
          local-pocketmine-mp <"$FIFO" >"$LOG" 2>&1 &
        DOCKER_PID=$!

        # Readiness is the server's own startFinished line
        # (resources/translations/eng.ini: 'Done ({%0}s)! For help, type "help"
        # or "?"'), not a fixed sleep and not "the process is alive". This run
        # is `docker run -i` with no `-t`, so docker/start.sh leaves ANSI off
        # by default; the strip below is a defensive no-op kept in case that
        # ever changes. Written as two commands rather than a pipeline because
        # `grep -q` exiting early would SIGPIPE the `sed` and `pipefail` would
        # then read a match as a miss.
        READY=0
        for _ in $(seq 1 180); do
          sed 's/\x1b\[[0-9;]*m//g' "$LOG" > "$LOG.clean"
          if grep -qF 'For help, type "help"' "$LOG.clean"; then
            READY=1
            break
          fi
          if ! kill -0 "$DOCKER_PID" 2>/dev/null; then
            break
          fi
          sleep 1
        done

        if [ "$READY" != 1 ]; then
          echo "::error::server never reached the startFinished line, so there was nothing to ping"
          cat "$LOG"
          exit 1
        fi
        echo "server is up, pinging 127.0.0.1:$HOST_PORT/udp"

        PING_STATUS=0
        python3 .github/workflows/raknet-ping.py 127.0.0.1 "$HOST_PORT" \
          --expect-motd "$EXPECTED_MOTD" \
          --expect-protocol "$EXPECTED_PROTOCOL" || PING_STATUS=$?

        # Shut down through the console `stop` command before reporting any
        # verdict, so the run never ends on an abrupt termination. `stop`
        # comes before the job-control `wait`: that wait blocks on the
        # backgrounded `docker run` exiting, and a server ignoring the
        # console `stop` would otherwise leave it blocked on a process
        # nothing had yet asked to exit, turning the "did not shut down
        # cleanly" verdict below into a 10-minute job cancellation instead.
        echo stop >&3
        exec 3>&-
        SHUTDOWN_STATUS=0
        timeout 120 docker wait "$CONTAINER_NAME" > /dev/null || SHUTDOWN_STATUS=$?
        docker stop "$CONTAINER_NAME" > /dev/null 2>&1 || true
        wait "$DOCKER_PID" || true

        echo "--- server log ---"
        cat "$LOG"
        echo "--- end server log ---"

        if [ "$PING_STATUS" != 0 ]; then
          echo "::error::NOT REACHABLE: no valid RakNet unconnected pong on $HOST_PORT/udp"
          exit "$PING_STATUS"
        fi
        if [ "$SHUTDOWN_STATUS" != 0 ]; then
          echo "::error::server did not shut down cleanly after 'stop' on stdin"
          exit 1
        fi
        echo "REACHABLE confirmed on $HOST_PORT/udp"
