name: Docker image CI

# A branch push is covered by its pull_request run. Triggering on both would
# run every job twice on the two shared self-hosted runners.
on:
  push:
    branches: [riftal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, riftal]

    steps:
    - uses: actions/checkout@v7
      with:
        # The image compiles PHP from the build/php submodule.
        submodules: true

    # The self-tests and the smoke steps' logs go through mktemp. The docker
    # steps bind-mount only paths in the checkout, never a temp dir.
    - name: Keep temp files off the shared /tmp
      uses: ./.github/actions/runner-temp
      with:
        php: false

    # Stub and fixture driven, no image needed, so a broken check fails in
    # seconds instead of after the 20-40 minute build it would otherwise
    # silently misjudge. docker-image-publish.yml runs the same script.
    - name: Self-test the checking scripts and check the workflows
      shell: bash
      run: bash .github/workflows/self-test-checks.sh

    # This runner's docker daemon and buildx state persist across separate
    # workflow runs, unlike a GitHub-hosted runner. A build killed mid-flight by
    # a cancellation can leave its builder's buildkitd wedged (issue #79: a
    # single, uncontested build hung right after a prior run was cancelled), so
    # the next run must not inherit that state by reusing a builder instance
    # that survived from before. `docker/setup-buildx-action` picks its own
    # builder name and does not guarantee a fresh one on a host like this, so
    # the name is scoped to this run and attempt instead, and the old builder
    # under that name is removed first in case a retried attempt left one
    # behind.
    - name: Create a run-scoped Buildx builder
      id: buildx
      shell: bash
      timeout-minutes: 5
      run: |
        set -euo pipefail
        BUILDER_NAME="pm-buildx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        # Written before the pre-clean and before create/bootstrap run, not
        # after, so the teardown step below still knows this run's builder
        # name even if any of what follows is what hangs, gets cancelled, or
        # times out.
        echo "name=$BUILDER_NAME" >> "$GITHUB_OUTPUT"
        docker buildx rm "$BUILDER_NAME" > /dev/null 2>&1 || true
        docker buildx create --name "$BUILDER_NAME" --driver docker-container --use --bootstrap

    - name: Create data directories
      run: mkdir ./docker/test_data

    # No step timeout survived a wedge for hours at the job's 360-minute
    # default (issue #79). 55 minutes leaves headroom over the documented
    # 20-40 minute real build time while still failing loud well inside an
    # hour.
    - name: Build image for tag
      id: build
      timeout-minutes: 55
      uses: docker/build-push-action@v7.4.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ github.workspace }}
        push: false
        load: true
        file: ${{ github.workspace }}/docker/Dockerfile
        tags: local-pocketmine-mp
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          GIT_HASH=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Leaves nothing behind for the next run to inherit, wedged or not.
    - name: Remove the run-scoped Buildx builder
      if: always()
      shell: bash
      timeout-minutes: 3
      run: docker buildx rm "${{ steps.buildx.outputs.name }}" > /dev/null 2>&1 || true

    # The riftal runners share one docker daemon, so another run can rebuild
    # the bare tag between this build and any step below (#164). Every later
    # step runs the image by the ID this build reported, never by the tag,
    # and check-pinned-image.sh fails the checks step if one stops doing so.
    - name: Pin the image this run built
      timeout-minutes: 2
      shell: bash
      env:
        BUILT_ID: ${{ steps.build.outputs.imageid }}
      run: |
        set -euo pipefail
        if ! [[ "$BUILT_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::the build reported image ID '$BUILT_ID', not a sha256 image ID"
          exit 1
        fi
        REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$BUILT_ID")"
        if [ "$REVISION" != "$GITHUB_SHA" ]; then
          echo "::error::$BUILT_ID carries revision '$REVISION', not this run's $GITHUB_SHA"
          exit 1
        fi
        echo "IMAGE_ID=$BUILT_ID" >> "$GITHUB_ENV"
        echo "the steps below run $BUILT_ID, built from $GITHUB_SHA"

    # Hard rule 7 fixes the base image for everything we build. Every other step
    # here would pass unchanged on any base, so without this one a stage left on
    # an older release, or a revert of a single FROM, ships green and unnoticed.
    - name: Test if it is built on the expected Ubuntu release
      shell: bash
      env:
        EXPECTED_UBUNTU: "24.04"
      run: |
        set -euo pipefail

        ACTUAL="$(docker run --rm "$IMAGE_ID" sh -c '. /etc/os-release && printf %s "$VERSION_ID"')"
        echo "runtime stage reports Ubuntu $ACTUAL"
        if [ "$ACTUAL" != "$EXPECTED_UBUNTU" ]; then
          echo "::error::runtime stage is Ubuntu $ACTUAL, expected $EXPECTED_UBUNTU"
          exit 1
        fi

        # The two build stages leave no trace in the shipped image, so the
        # Dockerfile is the only place their base can be read. A build stage on
        # a newer release than the runtime stage links the PHP binaries it
        # compiles against a glibc the runtime stage does not have.
        #
        # This has to walk every `FROM` line, not just the ones that already
        # say `ubuntu:`. A stage rebased onto a different distro, a digest
        # pin, or a build-arg image name stops matching a `FROM ubuntu:`
        # filter and disappears from the check entirely instead of failing
        # it. `EXPECTED_STAGES` is this Dockerfile's current stage count
        # (build-php, build-pocketmine, runtime): bump it in the same change
        # that adds or removes a stage.
        EXPECTED_STAGES=3
        TOTAL="$(grep -c '^FROM ' docker/Dockerfile)"
        if [ "$TOTAL" -ne "$EXPECTED_STAGES" ]; then
          echo "::error::docker/Dockerfile declares $TOTAL FROM line(s), expected $EXPECTED_STAGES; update EXPECTED_STAGES if a stage was added or removed"
          exit 1
        fi

        # A stage that chains off an earlier one (`FROM build-pocketmine AS
        # final`) names a stage declared earlier in this Dockerfile, not an
        # external image, so it carries no Ubuntu version of its own to
        # check: it inherits whatever its parent stage already had to pass.
        # `--platform=...` is a flag on the FROM instruction, not part of
        # the image name, and has to be stripped before comparing. Both
        # kinds of line are still walked here, so a stage added or removed
        # still moves TOTAL above.
        #
        # The walk itself lives in docker/check-ubuntu-base.sh, not inline,
        # so docker/check-ubuntu-base.selftest.sh can run it against fixtures
        # that exercise both branches: docker/Dockerfile alone never does.
        STRAGGLERS="$(docker/check-ubuntu-base.sh docker/Dockerfile "$EXPECTED_UBUNTU")"
        if [ -n "$STRAGGLERS" ]; then
          echo "::error::stage(s) not on Ubuntu $EXPECTED_UBUNTU at one shared pinned digest:"
          echo "$STRAGGLERS"
          exit 1
        fi
        echo "all $TOTAL stages pinned to Ubuntu $EXPECTED_UBUNTU at one digest"

    # Each boot passes --auto-report.enabled=0 and --auto-updater.enabled=0
    # exactly once: the shipped pocketmine.yml posts crash dumps to a public
    # archive and sends an update check from every boot, and a repeated flag
    # reaches the server as an array, which casts back to true (#91, #96).
    # shell: bash brings -e and pipefail. The server's exit status is held
    # until the upload check has read the log, because an upload only ever
    # comes from Server::crashDump(), which always exits non-zero.
    - name: Test if it runs the normal server properly
      timeout-minutes: 10
      shell: bash
      run: |
        LOG="$(mktemp)"
        STATUS=0
        echo stop | docker run --rm -i -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0 --auto-updater.enabled=0" "$IMAGE_ID" | tee "$LOG" || STATUS=$?
        .github/workflows/check-no-crash-upload.sh "$LOG"
        [ "$STATUS" = 0 ] || exit "$STATUS"

    - name: Test if it loads plugins
      timeout-minutes: 10
      shell: bash
      run: |
        LOG="$(mktemp)"
        STATUS=0
        echo stop | docker run --rm -i --user "$(id -u):$(id -g)" -v ./docker/test_data:/data -v ./docker/testsuite/create-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0 --auto-updater.enabled=0" "$IMAGE_ID" | tee "$LOG" || STATUS=$?
        .github/workflows/check-no-crash-upload.sh "$LOG"
        [ "$STATUS" = 0 ] || exit "$STATUS"
        test -f ./docker/test_data/plugin_data/data-test/create-data
        test "$(cat ./docker/test_data/plugin_data/data-test/create-data)" = "successful"

    # The plugin's own exit(1) only proves the check ran when the plugin loads
    # far enough to run it. If it never loads at all, the server still reaches
    # Done and docker run still exits 0, so the step needs its own positive
    # evidence that the check actually happened, not just that nothing failed.
    - name: Test if it persists plugin data
      timeout-minutes: 10
      shell: bash
      run: |
        LOG="$(mktemp)"
        STATUS=0
        echo stop | docker run --rm -i --user "$(id -u):$(id -g)" -v ./docker/test_data:/data -v ./docker/testsuite/verify-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0 --auto-updater.enabled=0" "$IMAGE_ID" | tee "$LOG" || STATUS=$?
        .github/workflows/check-no-crash-upload.sh "$LOG"
        [ "$STATUS" = 0 ] || exit "$STATUS"

        if ! grep -qF "Enabling data-test" "$LOG"; then
          echo "::error::data-test never enabled, so the persisted data was never actually checked"
          exit 1
        fi
        if ! grep -qF "Test passed: create-data is successful" "$LOG"; then
          echo "::error::verify-data did not report its explicit success notice"
          exit 1
        fi

    # REACHABLE coverage. The four steps above prove the image builds on the
    # right base and that the server boots and loads plugins, but none of them
    # publishes a port, so none of them can tell a joinable container from an
    # unjoinable one.
    # Bedrock is RakNet over UDP: a TCP-only publish produces a container that
    # passes every check above and that no client can join. Only a real UDP
    # round trip catches that.
    - name: Test if it is reachable over UDP
      timeout-minutes: 10
      shell: bash
      # A self-hosted runner shares one daemon across runs, jobs and matrix
      # legs, so the container name carries the run, attempt, job and leg,
      # and the script leaves the host port to the daemon.
      env:
        LEG: ${{ strategy.job-index }}
      run: |
        .github/workflows/reachable-smoke.sh "$IMAGE_ID" "pm-reachable-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${LEG}" riftal-reachable-probe

    # A server that crashes while enabling a plugin SIGKILLs its own pid after
    # the restart throttle. As a container's pid 1 it survives that and hangs
    # on the fixture's live thread (#105). docker/Dockerfile runs it under tini.
    - name: Test if a crash on boot exits the container
      timeout-minutes: 5
      shell: bash
      run: |
        .github/workflows/crash-boot-smoke.sh "$IMAGE_ID" "pm-crash-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ./docker/testsuite/crash-on-enable

    # Last, so only a build that passed every smoke step above gets a sha tag
    # riftal-infra can pin. The script tags only on a push to riftal.
    - name: Tag the image with its commit sha
      timeout-minutes: 2
      shell: bash
      run: bash .github/workflows/tag-image-sha.sh local-pocketmine-mp "$IMAGE_ID"
