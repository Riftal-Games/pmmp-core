name: "Copilot Agent environment setup"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

# The self-hosted runner (#46) reuses one workspace across runs, so a file a
# previous run's Docker mount left owned by a different uid blocks
# actions/checkout's own cleanup on the next run (#49). The reset below is a
# no-op on a fresh GitHub-hosted runner.
jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: [self-hosted, linux, riftal]

    permissions:
      contents: read

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: 8.3
          install-path: "./bin"
          pm-version-major: 5

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-8.3-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Clone extension stubs
        uses: actions/checkout@v7
        with:
          repository: pmmp/phpstorm-stubs
          path: extension-stubs
