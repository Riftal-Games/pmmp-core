name: CI (all supported PHP versions)

on:
  workflow_call:
    inputs:
      php:
        description: 'PHP version in X.Y format'
        required: true
        type: string

      #these are parameterized to ease updating
      pm-version-major:
        description: 'PocketMine-MP major version'
        default: 5
        type: number
      image:
        description: 'Runner labels to use, as a JSON array'
        default: '["self-hosted", "linux", "riftal"]'
        type: string

# Every job below resets its own workspace ownership before checkout. The
# self-hosted runner (#46) reuses one workspace across runs, so a file a
# previous job's Docker mount left owned by a different uid blocks
# actions/checkout's own cleanup on the next run (#49). The reset is a no-op
# on a fresh GitHub-hosted runner.
jobs:
  phpstan:
    name: PHPStan analysis
    runs-on: ${{ fromJson(inputs.image) }}

    strategy:
      fail-fast: false

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyze --no-progress --memory-limit=2G

  phpunit:
    name: PHPUnit tests
    runs-on: ${{ fromJson(inputs.image) }}
    strategy:
      fail-fast: false

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit

  integration:
    name: Integration tests
    runs-on: ${{ fromJson(inputs.image) }}
    strategy:
      fail-fast: false

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Run integration tests
        run: ./tests/travis.sh -t4

  codegen:
    name: Generated Code consistency checks
    runs-on: ${{ fromJson(inputs.image) }}
    strategy:
      fail-fast: false

    steps:
      - name: Reset workspace ownership from a previous run
        run: |
          if [ -e "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"
          fi

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Delete old generated code
        run: rm -rf generated

      - name: Update generated code
        run: composer update-codegen

      - name: Verify code is unchanged
        run: |
          git diff
          git diff --quiet

      - name: Check for generated code files colliding with src files
        run:
          php build/codegen/check-file-collisions.php
