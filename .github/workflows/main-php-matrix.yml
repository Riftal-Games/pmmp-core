name: CI (all supported PHP versions)

on:
  workflow_call:
    inputs:
      php:
        description: 'PHP version in X.Y format'
        required: true
        type: string

      #these are parameterized to ease updating
      pm-version-major:
        description: 'PocketMine-MP major version'
        default: 5
        type: number
      image:
        description: 'Runner labels to use, as a JSON array'
        default: '["self-hosted", "linux", "riftal"]'
        type: string

jobs:
  phpstan:
    name: PHPStan analysis
    runs-on: ${{ fromJson(inputs.image) }}

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      # PHPStan's cache defaults to sys_get_temp_dir(), which is /tmp: on the
      # self-hosted runners a tmpfs shared by every lane, which the 2G cache
      # can fill. runner.temp is on the runner's disk and emptied per job.
      - name: Run PHPStan
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ./vendor/bin/phpstan analyze --no-progress --memory-limit=2G
          du -sh "$(php -r 'echo sys_get_temp_dir();')/phpstan"

  phpunit:
    name: PHPUnit tests
    runs-on: ${{ fromJson(inputs.image) }}
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit

  integration:
    name: Integration tests
    runs-on: ${{ fromJson(inputs.image) }}
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup PHP
        uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction

      # The shared self-hosted runners give every matrix entry in this run the
      # same machine at once, unlike GitHub-hosted runners where each job got
      # its own. tests/travis.sh binds a hardcoded 19132/19133 by default, so
      # without this the 5 PHP versions collide on "Failed to bind socket".
      # inputs.php (e.g. "8.3") is folded into the offset because
      # GITHUB_RUN_ID alone is shared by every entry in this same matrix run.
      - name: Run integration tests
        shell: bash
        env:
          PHP_VERSION: ${{ inputs.php }}
        run: |
          set -euo pipefail
          PHP_NUM="${PHP_VERSION//./}"
          BASE_PORT=$(( 20000 + ( (GITHUB_RUN_ID * 131 + PHP_NUM * 7) % 39000 ) ))
          export PM_PORT="$BASE_PORT"
          export PM_PORT_V6="$((BASE_PORT + 1))"
          echo "using server-port=$PM_PORT server-portv6=$PM_PORT_V6"
          ./tests/travis.sh -t4

  codegen:
    name: Generated Code consistency checks
    runs-on: ${{ fromJson(inputs.image) }}
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: ${{ inputs.php }}
          install-path: "./bin"
          pm-version-major: ${{ inputs.pm-version-major }}

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ inputs.php }}-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Delete old generated code
        run: rm -rf generated

      - name: Update generated code
        run: composer update-codegen

      - name: Verify code is unchanged
        run: |
          git diff
          git diff --quiet

      - name: Check for generated code files colliding with src files
        run:
          php build/codegen/check-file-collisions.php
