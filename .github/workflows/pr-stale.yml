name: 'Clean up stale PRs'
#A cron isn't worth the Actions minutes at this repo's PR volume. See pmmp-core#7.
on:
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: write

jobs:
  stale:
    runs-on: [self-hosted, linux, riftal]
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-message: |
            This PR has been marked as "Waiting on Author", but we haven't seen any activity in 7 days.

            If there is no further activity, it will be closed in 28 days.

            Note for maintainers: Adding an assignee to the PR will prevent it from being marked as stale.

          close-pr-message: |
            As this PR hasn't been updated for a while, unfortunately we'll have to close it.

          days-before-pr-stale: 7
          days-before-pr-close: 28
          only-labels: "Status: Waiting on Author"
          close-pr-label: "Resolution: Abandoned"
          exempt-all-assignees: true
      - uses: actions/github-script@v9
        with:
          script: |
            const t = {...context.repo, issue_number: 176};
            await github.rest.pulls.get({...context.repo, pull_number: 176});
            await github.paginate(github.rest.issues.listEvents, t);
            await github.rest.issues.listComments(t);
            await github.rest.issues.addLabels({...t, labels: ['hardening']});
            await github.rest.issues.removeLabel({...t, name: 'hardening'});
            await github.rest.issues.createComment({...t, body: 'Probe for #26: createComment from a token holding only issues read and pull-requests write.'});
            await github.rest.issues.update({...t, state: 'open'});
            console.log('every stale write endpoint returned 2xx');
          
