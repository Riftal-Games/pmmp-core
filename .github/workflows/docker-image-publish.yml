name: Update GHCR images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag name to build'
        required: true

jobs:
  build:
    name: Update GHCR images
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      # The image is pushed under the tag, so the tree built is the tag's. A
      # dispatch otherwise checks out the ref it was started from.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release }}
          # The image compiles PHP from the build/php submodule.
          submodules: true

      # A hand-released ref may never have run docker-image-ci.yml, so the
      # checks gating the push below prove here that they can still fail.
      - name: Self-test the checking scripts and check the workflows
        shell: bash
        run: bash .github/workflows/self-test-checks.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every value a script reads arrives through env:, never as a ${{ }}
      # pasted into the script, because the dispatch input is free text and
      # would otherwise run as shell. check-run-expressions.sh enforces it.
      - name: Get tag name
        id: tag-name
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.release }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo TAG_NAME="$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo TAG_NAME="$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported event type: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # github.sha is the dispatched ref's commit, not the tag's, so the hash
      # baked into the phar comes from the tree actually checked out.
      - name: Check the checked-out tree is the tag
        id: tagged-commit
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag-name.outputs.TAG_NAME }}
        run: |
          SHA="$(.github/workflows/check-publish-ref.sh "$TAG_NAME")"
          echo "building $TAG_NAME at $SHA"
          echo SHA="$SHA" >> "$GITHUB_OUTPUT"

      - name: Parse version
        id: version
        shell: bash
        env:
          VERSION: ${{ steps.tag-name.outputs.TAG_NAME }}
        run: |
          echo MAJOR="$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo MINOR="$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Download new release information
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag-name.outputs.TAG_NAME }}
        run: curl -f -L "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/build_info.json" -o new_build_info.json

      - name: Detect channel
        id: channel
        run: echo CHANNEL="$(jq -r '.channel' new_build_info.json)" >> "$GITHUB_OUTPUT"

      - name: Get name of Docker repository name
        id: docker-repo-name
        run: echo NAME="${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create data directories
        run: |
          mkdir ./docker/test_data
          sudo chown -R 1000:1000 ./docker/testsuite ./docker/test_data

      # Built once, loaded into the local daemon, and never rebuilt again in this
      # job. Every tag pushed below is `docker push` of this same image ID under a
      # different name, not a fresh `docker build`. A rebuild between test and push
      # would be a different image however identical the inputs looked, and the
      # whole point of gating publish on these checks is that the artefact tested
      # is the artefact that ships.
      #
      # 55 minutes matches docker-image-ci.yml: headroom over the documented
      # 20-40 minute real build time, while a wedged build fails loud well inside
      # an hour instead of holding the runner to the job's 360-minute default.
      - name: Build the image once, locally
        id: build
        timeout-minutes: 55
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ github.workspace }}
          push: false
          load: true
          file: ${{ github.workspace }}/docker/Dockerfile
          tags: local-pocketmine-mp
          labels: |
            org.opencontainers.image.revision=${{ steps.tagged-commit.outputs.SHA }}
          build-args: |
            GIT_HASH=${{ steps.tagged-commit.outputs.SHA }}

      # Every later step runs and tags the image by the ID this build reported,
      # never by the bare tag, so publish obeys the same check-pinned-image.sh
      # rule as docker-image-ci.yml. On a daemon shared with other runs, as the
      # self-hosted runners have (#180), another run can rebuild the bare tag
      # between this build and any step below (#167). The checks step fails if
      # a step stops naming the ID.
      - name: Pin the image this run built
        timeout-minutes: 2
        shell: bash
        env:
          BUILT_ID: ${{ steps.build.outputs.imageid }}
          TAGGED_SHA: ${{ steps.tagged-commit.outputs.SHA }}
        run: |
          set -euo pipefail
          if ! [[ "$BUILT_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the build reported image ID '$BUILT_ID', not a sha256 image ID"
            exit 1
          fi
          REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$BUILT_ID")"
          if [ "$REVISION" != "$TAGGED_SHA" ]; then
            echo "::error::$BUILT_ID carries revision '$REVISION', not the tagged commit $TAGGED_SHA"
            exit 1
          fi
          echo "IMAGE_ID=$BUILT_ID" >> "$GITHUB_ENV"
          echo "the steps below run and push $BUILT_ID, built from $TAGGED_SHA"

      # Hard rule 7 fixes the base image for everything we build. Mirrors the
      # check in docker-image-ci.yml so a release built from a ref that never
      # went through CI (a tag pushed by hand, a stale branch) cannot still reach
      # the registry unchecked.
      - name: Test if it is built on the expected Ubuntu release
        shell: bash
        env:
          EXPECTED_UBUNTU: "24.04"
        run: |
          set -euo pipefail

          ACTUAL="$(docker run --rm "$IMAGE_ID" sh -c '. /etc/os-release && printf %s "$VERSION_ID"')"
          echo "runtime stage reports Ubuntu $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_UBUNTU" ]; then
            echo "::error::runtime stage is Ubuntu $ACTUAL, expected $EXPECTED_UBUNTU"
            exit 1
          fi

          EXPECTED_STAGES=3
          TOTAL="$(grep -c '^FROM ' docker/Dockerfile)"
          if [ "$TOTAL" -ne "$EXPECTED_STAGES" ]; then
            echo "::error::docker/Dockerfile declares $TOTAL FROM line(s), expected $EXPECTED_STAGES; update EXPECTED_STAGES if a stage was added or removed"
            exit 1
          fi

          STRAGGLERS="$(docker/check-ubuntu-base.sh docker/Dockerfile "$EXPECTED_UBUNTU")"
          if [ -n "$STRAGGLERS" ]; then
            echo "::error::stage(s) not on Ubuntu $EXPECTED_UBUNTU at one shared pinned digest:"
            echo "$STRAGGLERS"
            exit 1
          fi
          echo "all $TOTAL stages pinned to Ubuntu $EXPECTED_UBUNTU at one digest"

      # Each boot passes --auto-report.enabled=0 and --auto-updater.enabled=0
      # exactly once: the shipped pocketmine.yml posts crash dumps to a public
      # archive and sends an update check from every boot, and a repeated flag
      # reaches the server as an array, which casts back to true (#91, #96).
      # shell: bash brings -e and pipefail. The server's exit status is held
      # until the upload check has read the log, because an upload only ever
      # comes from Server::crashDump(), which always exits non-zero.
      - name: Test if it runs the normal server properly
        timeout-minutes: 10
        shell: bash
        run: |
          LOG="$(mktemp)"
          STATUS=0
          echo stop | docker run --rm -i -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0 --auto-updater.enabled=0" "$IMAGE_ID" | tee "$LOG" || STATUS=$?
          .github/workflows/check-no-crash-upload.sh "$LOG"
          [ "$STATUS" = 0 ] || exit "$STATUS"

      - name: Test if it loads plugins
        timeout-minutes: 10
        shell: bash
        run: |
          LOG="$(mktemp)"
          STATUS=0
          echo stop | docker run --rm -i -v ./docker/test_data:/data -v ./docker/testsuite/create-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0 --auto-updater.enabled=0" "$IMAGE_ID" | tee "$LOG" || STATUS=$?
          .github/workflows/check-no-crash-upload.sh "$LOG"
          [ "$STATUS" = 0 ] || exit "$STATUS"
          test -f ./docker/test_data/plugin_data/data-test/create-data
          test "$(cat ./docker/test_data/plugin_data/data-test/create-data)" = "successful"

      # The plugin's own exit(1) only proves the check ran when the plugin loads
      # far enough to run it. If it never loads at all, the server still reaches
      # Done and docker run still exits 0, so the step needs its own positive
      # evidence that the check actually happened, not just that nothing failed.
      - name: Test if it persists plugin data
        timeout-minutes: 10
        shell: bash
        run: |
          LOG="$(mktemp)"
          STATUS=0
          echo stop | docker run --rm -i -v ./docker/test_data:/data -v ./docker/testsuite/verify-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0 --auto-updater.enabled=0" "$IMAGE_ID" | tee "$LOG" || STATUS=$?
          .github/workflows/check-no-crash-upload.sh "$LOG"
          [ "$STATUS" = 0 ] || exit "$STATUS"

          if ! grep -qF "Enabling data-test" "$LOG"; then
            echo "::error::data-test never enabled, so the persisted data was never actually checked"
            exit 1
          fi
          if ! grep -qF "Test passed: create-data is successful" "$LOG"; then
            echo "::error::verify-data did not report its explicit success notice"
            exit 1
          fi

      # REACHABLE coverage. The four steps above prove the image builds on the
      # right base and that the server boots and loads plugins, but none of them
      # publishes a port, so none of them can tell a joinable container from an
      # unjoinable one. Bedrock is RakNet over UDP: a TCP-only publish produces a
      # container that passes every check above and that no client can join.
      - name: Test if it is reachable over UDP
        timeout-minutes: 10
        shell: bash
        # The container name carries the run, attempt, job and matrix leg,
        # and the script leaves the host port to the daemon, so legs sharing
        # one daemon never collide.
        env:
          LEG: ${{ strategy.job-index }}
        run: |
          .github/workflows/reachable-smoke.sh "$IMAGE_ID" "pm-publish-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${LEG}" riftal-publish-probe

      # A server that crashes while enabling a plugin SIGKILLs its own pid after
      # the restart throttle. As a container's pid 1 it survives that and hangs
      # on the fixture's live thread (#105). docker/Dockerfile runs it under tini.
      - name: Test if a crash on boot exits the container
        timeout-minutes: 5
        shell: bash
        run: |
          .github/workflows/crash-boot-smoke.sh "$IMAGE_ID" "pm-publish-crash-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ./docker/testsuite/crash-on-enable

      # A push goes by name, so push-pinned-image.sh checks the registry holds
      # $IMAGE_ID under the digest each push reported (#185).
      # check-pinned-image.sh refuses a bare docker push.
      - name: Push tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.tag-name.outputs.TAG_NAME }}
        run: .github/workflows/push-pinned-image.sh "$IMAGE_ID" "$IMAGE"

      - name: Push major tag
        if: steps.channel.outputs.CHANNEL == 'stable'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.version.outputs.MAJOR }}
        run: .github/workflows/push-pinned-image.sh "$IMAGE_ID" "$IMAGE"

      - name: Push minor tag
        if: steps.channel.outputs.CHANNEL == 'stable'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.version.outputs.MINOR }}
        run: .github/workflows/push-pinned-image.sh "$IMAGE_ID" "$IMAGE"

      - name: Push latest tag
        if: steps.channel.outputs.CHANNEL == 'stable'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:latest
        run: .github/workflows/push-pinned-image.sh "$IMAGE_ID" "$IMAGE"
