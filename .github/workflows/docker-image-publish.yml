name: Update GHCR images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag name to build'
        required: true

jobs:
  build:
    name: Update GHCR images
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true #needed for build/php submodule

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag name
        id: tag-name
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo TAG_NAME="${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo TAG_NAME="${{ github.event.inputs.release }}" >> $GITHUB_OUTPUT
          else
            echo "Unsupported event type: ${{ github.event_name }}"
            exit 1
          fi

      - name: Parse version
        id: version
        run: |
          VERSION="${{ steps.tag-name.outputs.TAG_NAME }}"
          echo MAJOR=$(echo $VERSION | cut -d. -f1) >> $GITHUB_OUTPUT
          echo MINOR=$(echo $VERSION | cut -d. -f1-2) >> $GITHUB_OUTPUT

      - name: Download new release information
        run: curl -f -L ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag-name.outputs.TAG_NAME }}/build_info.json -o new_build_info.json

      - name: Detect channel
        id: channel
        run: echo CHANNEL=$(jq -r '.channel' new_build_info.json) >> $GITHUB_OUTPUT

      - name: Get name of Docker repository name
        id: docker-repo-name
        run: echo NAME=$(echo "${GITHUB_REPOSITORY,,}") >> $GITHUB_OUTPUT

      - name: Create data directories
        run: |
          mkdir ./docker/test_data
          sudo chown -R 1000:1000 ./docker/testsuite ./docker/test_data

      # Built once, loaded into the local daemon, and never rebuilt again in this
      # job. Every tag pushed below is `docker push` of this same image ID under a
      # different name, not a fresh `docker build`. A rebuild between test and push
      # would be a different image however identical the inputs looked, and the
      # whole point of gating publish on these checks is that the artefact tested
      # is the artefact that ships.
      - name: Build the image once, locally
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ github.workspace }}
          push: false
          load: true
          file: ${{ github.workspace }}/docker/Dockerfile
          tags: local-pocketmine-mp
          build-args: |
            GIT_HASH=${{ github.sha }}

      # Hard rule 7 fixes the base image for everything we build. Mirrors the
      # check in docker-image-ci.yml so a release built from a ref that never
      # went through CI (a tag pushed by hand, a stale branch) cannot still reach
      # the registry unchecked.
      - name: Test if it is built on the expected Ubuntu release
        shell: bash
        env:
          EXPECTED_UBUNTU: "24.04"
        run: |
          set -euo pipefail

          ACTUAL="$(docker run --rm local-pocketmine-mp sh -c '. /etc/os-release && printf %s "$VERSION_ID"')"
          echo "runtime stage reports Ubuntu $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_UBUNTU" ]; then
            echo "::error::runtime stage is Ubuntu $ACTUAL, expected $EXPECTED_UBUNTU"
            exit 1
          fi

          EXPECTED_STAGES=3
          TOTAL="$(grep -c '^FROM ' docker/Dockerfile)"
          if [ "$TOTAL" -ne "$EXPECTED_STAGES" ]; then
            echo "::error::docker/Dockerfile declares $TOTAL FROM line(s), expected $EXPECTED_STAGES; update EXPECTED_STAGES if a stage was added or removed"
            exit 1
          fi

          STRAGGLERS="$(docker/check-ubuntu-base.sh docker/Dockerfile "$EXPECTED_UBUNTU")"
          if [ -n "$STRAGGLERS" ]; then
            echo "::error::stage(s) not on Ubuntu $EXPECTED_UBUNTU:"
            echo "$STRAGGLERS"
            exit 1
          fi
          echo "all $TOTAL stages pinned to Ubuntu $EXPECTED_UBUNTU"

      # Each boot passes --auto-report.enabled=0 exactly once: the shipped
      # pocketmine.yml posts crash dumps to a public archive, and a repeated
      # flag reaches the server as an array, which casts back to true (#91).
      # shell: bash brings -e and pipefail. The server's exit status is held
      # until the upload check has read the log, because an upload only ever
      # comes from Server::crashDump(), which always exits non-zero.
      - name: Test if it runs the normal server properly
        timeout-minutes: 10
        shell: bash
        run: |
          LOG="$(mktemp)"
          STATUS=0
          echo stop | docker run --rm -i -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0" local-pocketmine-mp | tee "$LOG" || STATUS=$?
          .github/workflows/check-no-crash-upload.sh "$LOG"
          [ "$STATUS" = 0 ] || exit "$STATUS"

      - name: Test if it loads plugins
        timeout-minutes: 10
        shell: bash
        run: |
          LOG="$(mktemp)"
          STATUS=0
          echo stop | docker run --rm -i -v ./docker/test_data:/data -v ./docker/testsuite/create-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0" local-pocketmine-mp | tee "$LOG" || STATUS=$?
          .github/workflows/check-no-crash-upload.sh "$LOG"
          [ "$STATUS" = 0 ] || exit "$STATUS"
          test -f ./docker/test_data/plugin_data/data-test/create-data
          test "$(cat ./docker/test_data/plugin_data/data-test/create-data)" = "successful"

      # The plugin's own exit(1) only proves the check ran when the plugin loads
      # far enough to run it. If it never loads at all, the server still reaches
      # Done and docker run still exits 0, so the step needs its own positive
      # evidence that the check actually happened, not just that nothing failed.
      - name: Test if it persists plugin data
        timeout-minutes: 10
        shell: bash
        run: |
          LOG="$(mktemp)"
          STATUS=0
          echo stop | docker run --rm -i -v ./docker/test_data:/data -v ./docker/testsuite/verify-data:/plugins -e POCKETMINE_ARGS="--settings.enable-dev-builds=1 --auto-report.enabled=0" local-pocketmine-mp | tee "$LOG" || STATUS=$?
          .github/workflows/check-no-crash-upload.sh "$LOG"
          [ "$STATUS" = 0 ] || exit "$STATUS"

          if ! grep -qF "Enabling data-test" "$LOG"; then
            echo "::error::data-test never enabled, so the persisted data was never actually checked"
            exit 1
          fi
          if ! grep -qF "Test passed: create-data is successful" "$LOG"; then
            echo "::error::verify-data did not report its explicit success notice"
            exit 1
          fi

      # REACHABLE coverage. The three checks above prove the image builds on the
      # right base and that the server boots and loads plugins, but none of them
      # publishes a port, so none of them can tell a joinable container from an
      # unjoinable one. Bedrock is RakNet over UDP: a TCP-only publish produces a
      # container that passes every check above and that no client can join.
      - name: Test if it is reachable over UDP
        timeout-minutes: 10
        shell: bash
        run: |
          .github/workflows/reachable-smoke.sh local-pocketmine-mp             "pm-publish-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             "$(( 20000 + (GITHUB_RUN_ID % 40000) ))"             riftal-publish-probe

      - name: Push tag
        run: |
          docker tag local-pocketmine-mp ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.tag-name.outputs.TAG_NAME }}
          docker push ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.tag-name.outputs.TAG_NAME }}

      - name: Push major tag
        if: steps.channel.outputs.CHANNEL == 'stable'
        run: |
          docker tag local-pocketmine-mp ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.version.outputs.MAJOR }}
          docker push ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.version.outputs.MAJOR }}

      - name: Push minor tag
        if: steps.channel.outputs.CHANNEL == 'stable'
        run: |
          docker tag local-pocketmine-mp ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.version.outputs.MINOR }}
          docker push ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:${{ steps.version.outputs.MINOR }}

      - name: Push latest tag
        if: steps.channel.outputs.CHANNEL == 'stable'
        run: |
          docker tag local-pocketmine-mp ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:latest
          docker push ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:latest
